# ============================================================
# UAV CTI Lab — Logstash Ingestion Pipeline
# File: docker/configs/logstash/pipelines/uav-pipeline.conf
#
# Ingests: Suricata EVE JSON, Zeek logs, MAVLink IDS alerts,
#          GPSD anomaly events, system logs from all lab VMs
#
# Citation [7]: Birnbaum et al. (2016) ICUAS 2016.
# ============================================================

input {
  # ── Suricata EVE JSON ──────────────────────────────────────
  file {
    path      => "/var/log/suricata/eve.json"
    codec     => "json"
    type      => "suricata"
    start_position => "beginning"
    sincedb_path   => "/usr/share/logstash/data/suricata.sincedb"
    tags      => ["suricata", "ids", "uav-lab"]
  }

  # ── Zeek MAVLink log ───────────────────────────────────────
  file {
    path      => "/usr/local/zeek/logs/current/mavlink.log"
    codec     => "json"
    type      => "zeek_mavlink"
    start_position => "beginning"
    sincedb_path   => "/usr/share/logstash/data/zeek-mavlink.sincedb"
    tags      => ["zeek", "mavlink", "uav-lab"]
  }

  # ── Zeek connection log ────────────────────────────────────
  file {
    path      => "/usr/local/zeek/logs/current/conn.log"
    codec     => "json"
    type      => "zeek_conn"
    start_position => "beginning"
    sincedb_path   => "/usr/share/logstash/data/zeek-conn.sincedb"
    tags      => ["zeek", "network", "uav-lab"]
  }

  # ── MAVLink IDS alerts ─────────────────────────────────────
  tcp {
    port => 5044
    codec => "json_lines"
    type => "mavlink_ids"
    tags => ["mavlink-ids", "detection", "uav-lab"]
  }

  # ── Syslog from all lab VMs ────────────────────────────────
  syslog {
    port => 5140
    type => "syslog"
    tags => ["syslog", "uav-lab"]
  }

  # ── GPSD anomaly events ────────────────────────────────────
  tcp {
    port => 5045
    codec => "json_lines"
    type => "gpsd_anomaly"
    tags => ["gpsd", "gps", "uav-lab"]
  }
}

filter {

  # ── Common timestamp normalization ────────────────────────
  if [timestamp] {
    date { match => ["timestamp", "ISO8601", "UNIX", "UNIX_MS"] }
  }
  if [@timestamp] {
    mutate { add_field => { "event_time" => "%{@timestamp}" } }
  }

  # ── Suricata EVE processing ───────────────────────────────
  if [type] == "suricata" {

    mutate {
      rename => {
        "src_ip"   => "source_ip"
        "dest_ip"  => "destination_ip"
        "src_port" => "source_port"
        "dest_port"=> "destination_port"
        "alert.signature"    => "rule_name"
        "alert.signature_id" => "rule_id"
        "alert.severity"     => "severity"
        "alert.category"     => "alert_category"
      }
    }

    # Tag UAV-specific alerts (our custom rule range 9100000+)
    if [rule_id] >= 9100000 {
      mutate {
        add_tag   => ["uav-detection", "cti-research"]
        add_field => { "detection_type" => "uav-custom-rule" }
      }
    }

    # Map severity to labels
    if [severity] == 1 {
      mutate { add_field => { "severity_label" => "HIGH" } }
    } else if [severity] == 2 {
      mutate { add_field => { "severity_label" => "MEDIUM" } }
    } else {
      mutate { add_field => { "severity_label" => "LOW" } }
    }
  }

  # ── Zeek MAVLink processing ───────────────────────────────
  if [type] == "zeek_mavlink" {

    mutate {
      add_field => { "protocol" => "MAVLink" }
      add_tag   => ["mavlink-telemetry"]
    }

    # Flag high-risk message types for SIEM correlation
    if [msg_id] in [11, 76, 84, 179, 192] {
      mutate {
        add_tag   => ["mavlink-high-risk"]
        add_field => { "risk_level" => "HIGH" }
      }
    }

    # Parse anomaly field for SIEM rules
    if [anomaly] {
      mutate { add_tag => ["mavlink-anomaly"] }
      grok {
        match => { "anomaly" => "(?<anomaly_type>[A-Z_]+):(?<anomaly_detail>.*)" }
      }
    }
  }

  # ── GPS anomaly enrichment ─────────────────────────────────
  if [type] == "gpsd_anomaly" {
    mutate {
      add_tag   => ["gps-anomaly", "possible-spoofing"]
      add_field => {
        "mitre_tactic"    => "RF-Domain-Manipulation"
        "mitre_technique" => "GPS-Spoofing"
        "cve_reference"   => "ION-GNSS-2008-Humphreys"
      }
    }
  }

  # ── GeoIP enrichment for external IPs ─────────────────────
  if [source_ip] and [source_ip] !~ "^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)" {
    geoip {
      source => "source_ip"
      target => "source_geo"
    }
  }

  # ── Add lab metadata to all events ────────────────────────
  mutate {
    add_field => {
      "lab_name"       => "UAV-CTI-Research-Lab"
      "research_phase" => "detection-evaluation"
      "dataset_version"=> "1.0"
    }
  }

  # ── Remove unwanted fields ────────────────────────────────
  mutate {
    remove_field => ["host", "agent", "ecs", "input", "log"]
  }
}

output {

  # ── Primary: Elasticsearch ────────────────────────────────
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    user     => "elastic"
    password => "${ELASTIC_PASSWORD}"

    # Dynamic index based on event type
    index => "uav-cti-%{type}-%{+YYYY.MM.dd}"

    # ILM policy for log retention
    ilm_enabled       => true
    ilm_rollover_alias => "uav-cti-logs"
    ilm_policy        => "uav-lab-30day"
  }

  # ── Secondary: Alert-only stream to TheHive ───────────────
  if "uav-detection" in [tags] and [severity_label] == "HIGH" {
    http {
      url    => "http://thehive:9000/api/alert"
      verb   => "POST"
      format => "json"
      headers => {
        "Authorization" => "Bearer ${THEHIVE_API_KEY}"
        "Content-Type"  => "application/json"
      }
      mapping => {
        "title"       => "[UAV-CTI] %{rule_name}"
        "description" => "Suricata rule %{rule_id} triggered: %{rule_name}\nSource: %{source_ip}:%{source_port} → %{destination_ip}:%{destination_port}"
        "severity"    => "3"
        "source"      => "Suricata-IDS"
        "sourceRef"   => "%{rule_id}-%{+UNIX}"
        "type"        => "UAV-Detection"
        "tags"        => ["uav-cti", "auto-alert"]
      }
    }
  }
}
